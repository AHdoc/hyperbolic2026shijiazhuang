<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperbolic 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Full‑screen background with poster */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./poster.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
            /* Fallback if image doesn't load */
            background-color: #1a1a1a;
        }

        /* Dark overlay for better text readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        /* Content container */
        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            color: white;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
            margin-bottom: 3rem;
            opacity: 0.9;
        }

        /* Button group */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: rgba(200, 164, 92, 0.8);
            border-color: #c8a45c;
        }

        .btn-primary:hover {
            background: rgba(200, 164, 92, 0.95);
        }

        /* Footer */
        .footer-note {
            position: absolute;
            bottom: 1.5rem;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            z-index: 1;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .btn {
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="content">
        <!-- You can replace these headings with the actual conference title if needed -->
        <p class="subtitle">Conference on Frontiers of Mathematics</p>
        <h1>Remarkable Developments on Hyperbolic Geometry</h1>
        <p class="subtitle">in honour of Greg McShane's 60th birthday<br>August 31 - September 4, 2026 • Shijiazhuang, China</p>

        <div class="button-group">
            <!-- Link to Schedule & Talks page (replace "#schedule" with your URL) -->
            <a href="#schedule" class="btn" target="_blank">📅 Schedule & Talks</a>

            <!-- Link to Location & Transport page -->
            <a href="#location" class="btn" target="_blank">📍 Location & Transport</a>

            <!-- Link to Registration page (highlighted) -->
            <a href="#register" class="btn btn-primary" target="_blank">🎟️ Register Now</a>
        </div>
    </div>

    <div class="footer-note">
        Hosted by Hebei Normal University • <a href="xxx@xxx" style="color:#e0c78a;text-decoration:none;">Contact Us</a>
    </div>
</body>
</html>
