<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperbolic 2026</title>

    <!-- Google Fonts for elegant typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #e0c78a;
            --gold-glow: rgba(224, 199, 138, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;                        /* keeps the animated background contained */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ── Full‑screen background with slow zoom ── */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./poster.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
            background-color: #1a1a1a;
            animation: slowZoom 30s ease-in-out infinite alternate;
            transform-origin: center;
            will-change: transform;
        }

        @keyframes slowZoom {
            0%   { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* ── Vignette overlay (radial gradient) ── */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
            z-index: -1;
        }

        /* ── Main content ── */
        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            color: white;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Conference series (top line) ── */
        .conference-series {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--gold);
            margin-bottom: 0.75rem;
            display: inline-block;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid rgba(224,199,138,0.5);
        }

        /* ── Main title ── */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            max-width: 800px;
        }

        /* ── Subtitle block (dedication + date) ── */
        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.7);
            margin-bottom: 2.5rem;
            opacity: 0.95;
            line-height: 1.6;
        }

        /* Honouree: warm gold highlight */
        .honouree {
            color: var(--gold);
            font-weight: 600;
            font-style: italic;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        /* Date details slightly smaller & lighter */
        .event-date {
            display: block;
            margin-top: 0.4rem;
            font-size: 0.9em;
            opacity: 0.85;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* ── Button group ── */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.4rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            letter-spacing: 0.02em;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        /* Primary button with accent */
        .btn-primary {
            background: rgba(200, 164, 92, 0.75);
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
            animation: gentlePulse 2.5s infinite;
        }

        .btn-primary:hover {
            background: rgba(200, 164, 92, 0.95);
            border-color: #fff3d6;
            box-shadow: 0 0 30px rgba(224,199,138,0.7);
            animation: none;
        }

        @keyframes gentlePulse {
            0%   { box-shadow: 0 0 0 0 var(--gold-glow); }
            70%  { box-shadow: 0 0 18px 5px rgba(224,199,138,0.3); }
            100% { box-shadow: 0 0 0 0 var(--gold-glow); }
        }

        /* ── Footer ── */
        .footer-note {
            position: absolute;
            bottom: 1.8rem;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
            z-index: 1;
            font-weight: 300;
            letter-spacing: 0.03em;
        }

        .footer-note a {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px dotted rgba(224,199,138,0.6);
            transition: color 0.3s;
        }

        .footer-note a:hover {
            color: #fff;
            border-bottom-color: white;
        }

        /* ── Mobile optimisations ── */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.4rem;
            }
            .conference-series {
                font-size: 0.9rem;
                letter-spacing: 0.12em;
            }
            .btn {
                padding: 0.8rem 1.6rem;
                font-size: 0.9rem;
            }
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="content">
        <h2 class="conference-series">Conference on Frontiers of Mathematics</h2>
        <h1>Remarkable Developments on Hyperbolic Geometry</h1>
        <p class="subtitle">
            in honour of <span class="honouree">Greg McShane</span>'s 60th birthday<br>
            <span class="event-date">August 31 – September 4, 2026 • Shijiazhuang, China</span>
        </p>

        <div class="button-group">
            <a href="schedule" class="btn">📅 Schedule &amp; Talks</a>
            <a href="location" class="btn">📍 Location &amp; Transport</a>
            <a href="register" class="btn btn-primary">🎟️ Register Now</a>
        </div>
    </div>

    <div class="footer-note">
        Hosted by Hebei Normal University • <a href="mailto:binbin.xu@hebtu.edu.cn">Contact Us</a>
    </div>
</body>
</html>
